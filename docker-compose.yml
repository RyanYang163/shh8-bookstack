version: "3.8"

services:
  shh8-bookstack:
    image: linuxserver/bookstack:26.05.5
    container_name: shh8-bookstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    ports:
      - "18808:80"
    user: "1000:1000"
    volumes:
      - /Volume*/DockerAppData/shh8-bookstack/data:/config
    environment:
      - TZ=Asia/Shanghai
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "500m"
          memory: 512M

x-app-meta:
  web:
    port: 18808
    protocol: http
