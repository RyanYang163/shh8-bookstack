# ============================================================================
# BookStack — TOS 7 application package
#
# Upstream : https://github.com/BookStackApp/BookStack
# License  : MIT
# Copyright: upstream project contributors (see https://github.com/BookStackApp/BookStack)
#
# This compose file is part of the TOS platform integration only. The images
# below are published by their upstream projects and used unmodified.
# Full license text: see LICENSE in the repository root.
#
# Two services: the application plus a MariaDB instance that is NOT published
# to the LAN (no host port) and is reachable only over the private compose
# network.
#
# No credentials are shipped in this file. On first start each service
# generates its own random secret into the shared `secret/` volume and reuses
# it on every later start. See README.md §权限与最小化 and PRIVACY.md §4.
#
# Least privilege: no privileged mode, no host network, capabilities reduced
# to an explicit allow-list.
# ============================================================================
services:
  shh8-bookstack:
    image: linuxserver/bookstack:26.05.5
    container_name: shh8-bookstack
    # Wrapper around the image's own /init (s6-overlay). It only prepares the
    # environment and then hands PID 1 to /init with exec, so s6 starts exactly
    # as it normally would. `exec /init` must stay the last statement.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu

        # 1) Wait for the database service to publish the shared password.
        #    MariaDB initialisation routinely takes longer than the 30s the
        #    image's own init script waits, so wait here before /init runs.
        i=0
        while [ ! -s /secret/db_password ]; do
          i=$((i + 1))
          [ "$i" -gt 90 ] && { echo "FATAL: /secret/db_password was never created"; exit 1; }
          sleep 2
        done

        # 2) The password existing does not mean the server accepts connections.
        j=0
        while ! nc -w1 shh8-bookstack-db 3306 </dev/null >/dev/null 2>&1; do
          j=$((j+1))
          [ "$j" -gt 90 ] && { echo "FATAL: database port 3306 never became reachable"; exit 1; }
          sleep 2
        done

        # 3) Application encryption key: generated once, then reused.
        if [ ! -s /config/app_key ]; then
          k="$(head -c 32 /dev/urandom | base64 | tr -d '\n')"
          [ "${#k}" -eq 44 ] || { echo "FATAL: could not generate the application key"; exit 1; }
          printf '%s' "$k" > /config/app_key.tmp
          mv /config/app_key.tmp /config/app_key
        fi
        k="$(cat /config/app_key)"
        [ "${#k}" -eq 44 ] || { echo "FATAL: /config/app_key is malformed"; exit 1; }

        DB_PASSWORD="$(cat /secret/db_password)"
        APP_KEY="base64:${k}"
        export DB_PASSWORD APP_KEY

        # 4) Mirror the two generated secrets into .env so that commands run
        #    via `docker exec ... artisan ...` (the upstream README's update-url
        #    procedure) also see them. The environment variables above remain
        #    authoritative; this step is best-effort and never fatal.
        if [ ! -s /config/www/.env ] && [ -f /app/www/.env.example ]; then
          cp /app/www/.env.example /config/www/.env
        fi
        if [ -s /config/www/.env ]; then
          grep -qF "APP_KEY=${APP_KEY}" /config/www/.env ||
            sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" /config/www/.env || true
          grep -qF "DB_PASSWORD=${DB_PASSWORD}" /config/www/.env ||
            sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=${DB_PASSWORD}|" /config/www/.env || true
        fi

        exec /init
    healthcheck:
      # Probes a page that reads the database, so a broken database surfaces as
      # "unhealthy" instead of a container that merely looks alive.
      # busybox wget is always present in this alpine-based image; curl is not.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    restart: unless-stopped
    ports:
      - "18808:80"
    depends_on:
      shh8-bookstack-db:
        condition: service_healthy
    volumes:
      - /Volume*/DockerAppData/shh8-bookstack/data:/config
      - /Volume*/DockerAppData/shh8-bookstack/www:/config/www
      - /Volume*/DockerAppData/shh8-bookstack/secret:/secret
    environment:
      - TZ=Asia/Shanghai
      # The image's s6 init drops privileges to this UID/GID, so the nginx and
      # php-fpm worker processes run as uid 1000 rather than root.
      - PUID=1000
      - PGID=1000
      - DB_HOST=shh8-bookstack-db
      - DB_PORT=3306
      - DB_DATABASE=bookstack
      - DB_USERNAME=bookstack
      # DB_PASSWORD and APP_KEY are intentionally absent: both are generated at
      # first start by the entrypoint above and never ship inside the package.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Allow-list: Docker's default set minus NET_RAW / SETPCAP / SETFCAP,
      # none of which this application needs.
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - SYS_CHROOT
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  shh8-bookstack-db:
    # 为什么是 linuxserver/mariadb 而不是官方 mariadb：
    # 2026-09-22 用 trivy 0.74.0 实测，官方 mariadb 的**所有**变体都带 22 个可修复
    # HIGH/CRITICAL（11.8.9 / 11.8.9-noble / 11.4 / 10.11 均为 22，11.8.9-ubi 为 41），
    # 而本镜像与 bookstack 同用 LinuxServer.io 的 alpine 基底，实测 0 / 0。
    # 详见 ../../开发应用计划/TOS社区应用官方审核反馈-20260922.md
    image: linuxserver/mariadb:11.8.8
    container_name: shh8-bookstack-db
    # This service is the only producer of the database password. The
    # application service waits for the file rather than generating its own, so
    # the two can never disagree. The variables are exported before exec'ing the
    # image's own /init (s6-overlay), which is where the image reads them.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu

        gen() {
          v="$(head -c 32 /dev/urandom | base64 | tr -d '\n')"
          [ "${#v}" -eq 44 ] || { echo "FATAL: could not generate $1"; exit 1; }
          printf '%s' "$v" > "$1.tmp"
          chmod 600 "$1.tmp"
          mv "$1.tmp" "$1"
        }

        [ -s /secret/db_password ] || gen /secret/db_password
        [ -s /secret/db_root_password ] || gen /secret/db_root_password

        MYSQL_PASSWORD="$(cat /secret/db_password)"
        MYSQL_ROOT_PASSWORD="$(cat /secret/db_root_password)"
        export MYSQL_PASSWORD MYSQL_ROOT_PASSWORD

        exec /init
    healthcheck:
      # Simple reachability probe. Readiness beyond "the port answers" is handled
      # by the application container's own wait loop and by BookStack's own
      # database wait, so this stays deliberately simple — an over-strict probe
      # that the image cannot satisfy would mark the app "Not Enabled".
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3306 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    volumes:
      - /Volume*/DockerAppData/shh8-bookstack/db:/config
      - /Volume*/DockerAppData/shh8-bookstack/secret:/secret
    environment:
      - TZ=Asia/Shanghai
      # The image's s6 init drops privileges to this UID/GID; the MariaDB server
      # process runs as uid 1000, never as root.
      - PUID=1000
      - PGID=1000
      - MYSQL_DATABASE=bookstack
      - MYSQL_USER=bookstack
      # MYSQL_PASSWORD and MYSQL_ROOT_PASSWORD are intentionally absent: both are
      # generated at first start by the entrypoint above and never ship inside
      # the package. The image requires all three of DATABASE/USER/PASSWORD.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Allow-list: Docker's default set minus NET_RAW / SETPCAP / SETFCAP.
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - SETGID
      - SETUID
      - SYS_CHROOT
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G

x-app-meta:
  web:
    port: 18808
    protocol: http
