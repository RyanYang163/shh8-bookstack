services:
  shh8-bookstack:
    image: linuxserver/bookstack:26.05.5
    container_name: shh8-bookstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    ports:
      - "18808:80"
    volumes:
      - /Volume*/DockerAppData/shh8-bookstack/data:/config
      - /Volume*/DockerAppData/shh8-bookstack/www:/config/www
    environment:
      - TZ=Asia/Shanghai
      - PUID=1000
      - PGID=1000
      - APP_KEY=base64:QUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVphYmNkZWY=
      - DB_HOST=127.0.0.1
      - DB_PORT=3306
      - DB_DATABASE=bookstack
      - DB_USERNAME=bookstack
      - DB_PASSWORD=bookstack
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

x-app-meta:
  web:
    port: 18808
    protocol: http
