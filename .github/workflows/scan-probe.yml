# 一次性探测：量各个候选数据库镜像的 HIGH/CRITICAL 数量（含「有官方修复」的）
# 用完即删 —— 不参与发布流程，不产出任何 Release。
name: scan-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - linuxserver/bookstack:26.05.5     # 基线：已知干净
          - mariadb:11.8.9                    # 当前选择
          - mariadb:11.8.9-ubi                # Red Hat UBI 基底
          - mariadb:11.8.9-noble              # Ubuntu noble（与 11.8.9 同基底，作对照）
          - mariadb:11.4                      # LTS
          - mariadb:10.11                     # 更老的 LTS
          - linuxserver/mariadb:11.8.8        # LSIO 版（alpine 基底）
    steps:
      - name: Install trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Scan ${{ matrix.image }}
        run: |
          IMG='${{ matrix.image }}'
          count() { python3 -c "
          import json,sys
          try: d=json.load(open(sys.argv[1]))
          except Exception: print('n/a'); raise SystemExit
          print(sum(len(r.get('Vulnerabilities') or []) for r in d.get('Results',[])))
          " "$1"; }

          if ! trivy image --severity HIGH,CRITICAL --no-progress --format json \
                 -o t.json "$IMG" 2>/dev/null; then
            echo "::notice::$IMG  拉取/扫描失败（镜像可能不存在）"
            exit 0
          fi
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
                --format json -o f.json "$IMG" 2>/dev/null || true

          T=$(count t.json); F=$(count f.json)
          echo "::notice::$IMG  HIGH/CRITICAL 总数=$T  其中可修复=$F"
          echo "$IMG  总数=$T  可修复=$F"
